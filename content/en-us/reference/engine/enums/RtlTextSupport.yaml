-- === دالة إنشاء أجزاء بجماليات وإضاءة ===
local function createPart(props)
    local part = Instance.new("Part")
    for k,v in pairs(props) do
        if k ~= "Parent" and k ~= "MaterialEffect" and k ~= "ColorEffect" and k ~= "Particle" then
            part[k]=v
        end
    end
    part.Anchored = true
    part.Parent = props.Parent or cityFolder
    if props.MaterialEffect then
        part.Material = props.MaterialEffect
    end
    if props.ColorEffect then
        local pointLight = Instance.new("PointLight", part)
        pointLight.Color = props.Color
        pointLight.Brightness = 2
        pointLight.Range = 15
    end
    if props.Particle then
        local emitter = Instance.new("ParticleEmitter", part)
        emitter.Color = ColorSequence.new(props.Color)
        emitter.Rate = 8
        emitter.Lifetime = NumberRange.new(1.2,2.2)
        emitter.Size = NumberSequence.new(1)
        emitter.Speed = NumberRange.new(3,5)
        emitter.Texture = "rbxassetid://4844366222"
    end
    return part
end

