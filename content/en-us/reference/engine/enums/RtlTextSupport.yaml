    local starter = game:GetService("StarterPlayer"):FindFirstChild("StarterPlayerScripts")
    if not starter:FindFirstChild("TaskGuiClient") then
        local s = Instance.new("LocalScript")
        s.Name = "TaskGuiClient"
        s.Source = taskGuiScript
        s.Parent = starter
    end
end
