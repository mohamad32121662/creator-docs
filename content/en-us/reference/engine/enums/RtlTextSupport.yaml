-- عند دخول البعد الرقمي: تشغيل موسيقى رقمية
local portals = gatesFolder
if portals then
    for _,p in ipairs(portals:GetChildren()) do
        if p:IsA("BasePart") and p:FindFirstChild("Dimension") then
            p.Touched:Connect(function(hit)
                local player = Players:GetPlayerFromCharacter(hit.Parent)
                if player and p.Dimension.Value == "Pixelated" then
                    if not SoundService:FindFirstChild("PixelMusic") then
                        local pxMusic = Instance.new("Sound", SoundService)
                        pxMusic.Name = "PixelMusic"
                        pxMusic.SoundId = pixelMusicId
                        pxMusic.Volume = 0.55
                        pxMusic.Looped = true
                        pxMusic:Play()
                    end
                    -- أوقف موسيقى المدينة
                    if SoundService:FindFirstChild("CityMusic") then
                        SoundService.CityMusic:Stop()
                    end
                end
            end)
        end
    end
end

-- === نظام مهام للاعبين (تحديث مستمر) ===
local taskEvent = Instance.new("RemoteEvent", ReplicatedStorage)
taskEvent.Name = "TaskUpdate"

local sampleTasks = {
    {"استكشف المدينة!", false},
    {"ادخل البعد الرقمي", false},
    {"اهزم عدو رقمي واحد", false},
    {"اجمع 3 عناصر رقمية", false},
}
local playerTasks = {}

-- تحديث واجهة المهام
local function updateTasksForPlayer(player)
    local tasks = playerTasks[player] or sampleTasks
    taskEvent:FireClient(player, tasks)
end

Players.PlayerAdded:Connect(function(player)
    playerTasks[player] = {
        {"استكشف المدينة!", true},
        {"ادخل البعد الرقمي", false},
        {"اهزم عدو رقمي واحد", false},
        {"اجمع 3 عناصر رقمية", false},
    }
    updateTasksForPlayer(player)
end)

-- عند دخول البعد الرقمي حدث المهمة الثانية
for _,p in ipairs(gatesFolder:GetChildren()) do
    if p:IsA("BasePart") and p:FindFirstChild("Dimension") and p.Dimension.Value=="Pixelated" then
        p.Touched:Connect(function(hit)
            local player = Players:GetPlayerFromCharacter(hit.Parent)
            if player and playerTasks[player] then
                playerTasks[player][2][2]=true
                updateTasksForPlayer(player)
            end
        end)
    end
end

-- === سكربت أعداء أذكياء في البعد الرقمي ===
local function spawnDigitalEnemy(pos)
    local enemy = Instance.new("Part")
    enemy.Name = "DigitalVirus"
    enemy.Size = Vector3.new(3,3,3)
    enemy.Position = pos
    enemy.Anchored = false
    enemy.Color = Color3.fromRGB(255,0,200)
    enemy.Material = Enum.Material.Neon
    enemy.Parent = enemiesFolder
    local hum = Instance.new("Humanoid", enemy)
    hum.Health = 40
    -- مؤثرات
    local pl = Instance.new("PointLight", enemy)
    pl.Color = Color3.fromRGB(255,0,200)
    pl.Brightness = 8
    local emitter = Instance.new("ParticleEmitter", enemy)
    emitter.Color = ColorSequence.new(Color3.fromRGB(255,0,200))
    emitter.Rate = 12
    emitter.Lifetime = NumberRange.new(0.5,1.1)
    emitter.Size = NumberSequence.new(1.25)
    emitter.Texture = "rbxassetid://4844366222"
    -- ذكاء اصطناعي بسيط: مطاردة أقرب لاعب في البعد الرقمي
    local RunService = game:GetService("RunService")
    local chasing = true
    local function findNearestPlayer()
        local nearest, minDist = nil, math.huge
        for _, player in pairs(Players:GetPlayers()) do
            if player.Character and player.Character:FindFirstChild("HumanoidRootPart") then
                if (player.Character.HumanoidRootPart.Position - pos).magnitude < 60 then
                    local dist = (player.Character.HumanoidRootPart.Position - enemy.Position).magnitude
                    if dist < minDist then
                        nearest = player.Character
                        minDist = dist
                    end
                end
            end
        end
        return nearest
    end
    local conn
    conn = RunService.Heartbeat:Connect(function()
        if not chasing then conn:Disconnect() end
        local target = findNearestPlayer()
        if target then
            local dir = (target.HumanoidRootPart.Position - enemy.Position).unit
            enemy.Velocity = dir * 30
        else
            enemy.Velocity = Vector3.new()
        end
    end)
    -- عند موت العدو: تحديث المهام
    hum.Died:Connect(function()
        chasing = false
        for _,player in pairs(Players:GetPlayers()) do
            if player.Character and (player.Character.HumanoidRootPart.Position - enemy.Position).magnitude < 50 and playerTasks[player] then
                playerTasks[player][3][2]=true
                updateTasksForPlayer(player)
            end
        end
    end)
end

-- توليد أعداء تلقائياً في البعد الرقمي
local pixelSpawn = dimensionsFolder:FindFirstChild("Pixelated")
if pixelSpawn then
    for i=1,3 do
        spawnDigitalEnemy(pixelSpawn.Position + Vector3.new(math.random(-15,15),3,math.random(-15,15)))
    end
end

