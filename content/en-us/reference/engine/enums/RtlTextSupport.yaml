-- === إنشاء البوابات مع نظام الانتقال والمؤثرات الصوتية ===
local portalSoundId = "rbxassetid://9118828560" -- أضف ID صوت الانتقال الخاص بك هنا
for i,portal in ipairs(dimensionsInfo) do
    if not gatesFolder:FindFirstChild(portal.name.."Portal") then
        local p = createPart{
            Name=portal.name.."Portal",
            Size=Vector3.new(6,12,1.5),
            Position=portal.pos/2,
            Color=portal.color,
            Material=Enum.Material.Neon,
            Parent=gatesFolder,
            ColorEffect=true,
            Particle=true
        }
        p.CanCollide = false
        -- بوابة دائرية
        local ring = Instance.new("Part")
        ring.Shape = Enum.PartType.Cylinder
        ring.Size = Vector3.new(1.5,8,8)
        ring.Position = p.Position + Vector3.new(0,6,0)
        ring.Orientation = Vector3.new(0,0,90)
        ring.Anchored = true
        ring.CanCollide = false
        ring.Color = portal.color
        ring.Material = Enum.Material.ForceField
        ring.Parent = gatesFolder
        local ringLight = Instance.new("PointLight", ring)
        ringLight.Color = portal.color
        ringLight.Brightness = 4
        ringLight.Range = 18
        local dimValue = Instance.new("StringValue", p)
        dimValue.Name = "Dimension"
        dimValue.Value = portal.name
        -- الانتقال + صوت المؤثر
        p.Touched:Connect(function(hit)
            local player = Players:GetPlayerFromCharacter(hit.Parent)
            if player and player.Character and player.Character:FindFirstChild("HumanoidRootPart") then
                if not player.Character:FindFirstChild("TeleportCooldown") then
                    local cooldown = Instance.new("BoolValue")
                    cooldown.Name = "TeleportCooldown"
                    cooldown.Parent = player.Character
                    -- مؤثر صوتي
                    local sound = Instance.new("Sound", SoundService)
                    sound.SoundId = portalSoundId
                    sound.Volume = 1
                    sound:Play()
                    game:GetService("Debris"):AddItem(sound,2)
                    local dimensionName = p:FindFirstChild("Dimension")
                    if dimensionName then
                        local targetFolder = Workspace:FindFirstChild("Dimensions")
                        if targetFolder then
                            local targetPart = targetFolder:FindFirstChild(dimensionName.Value)
                            if targetPart and targetPart:IsA("BasePart") then
                                local char = player.Character
                                if char:FindFirstChild("HumanoidRootPart") then
                                    local hrp = char.HumanoidRootPart
                                    local fx = Instance.new("ParticleEmitter", hrp)
                                    fx.Texture = "rbxassetid://4844366222"
                                    fx.Speed = NumberRange.new(10,15)
                                    fx.Lifetime = NumberRange.new(0.5,0.7)
                                    fx.Size = NumberSequence.new(2)
                                    fx.Rate = 80
                                    fx.Color = ColorSequence.new(portal.color)
                                    game:GetService("Debris"):AddItem(fx, 1)
                                end
                                player.Character:SetPrimaryPartCFrame(CFrame.new(targetPart.Position + Vector3.new(0,5,0)))
                            end
                        end
                    end
                    wait(3)
                    cooldown:Destroy()
                end
            end
        end)
    end
end

